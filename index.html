<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>send</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #06060a;
    color: #eaeaf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    overflow: hidden;
    position: relative;
  }
  /* ambient glow blobs */
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(120px); opacity: .5; pointer-events: none; z-index: 0;
    animation: drift 14s ease-in-out infinite alternate;
  }
  body::before { width: 420px; height: 420px; background: #5865F2; top: -140px; left: -140px; }
  body::after  { width: 380px; height: 380px; background: #EB459E; bottom: -160px; right: -120px; animation-delay: -7s; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: rgba(18, 18, 24, 0.72);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 26px 22px 22px;
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow:
      0 20px 60px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.06);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 20px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #57F287; box-shadow: 0 0 12px #57F287;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 4px #57F287; } }
  .brand h1 {
    font-size: 14px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; margin: 0;
    background: linear-gradient(90deg, #b9c0ff, #ffb9ec);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  label {
    display: block; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: #8a8aa0;
    margin: 0 0 8px 2px; font-weight: 600;
  }

  .field { position: relative; margin-bottom: 16px; }
  input, textarea {
    width: 100%; border: 1px solid rgba(255,255,255,.09);
    background: rgba(8,8,12,.7);
    color: #eaeaf2; font-size: 15px; font-family: inherit;
    padding: 13px 14px; border-radius: 12px;
    outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  input::placeholder, textarea::placeholder { color: #55556a; }
  input:focus, textarea:focus {
    border-color: rgba(88,101,242,.8);
    box-shadow: 0 0 0 4px rgba(88,101,242,.18);
    background: rgba(10,10,16,.9);
  }

  button {
    width: 100%; border: none; cursor: pointer;
    padding: 15px; border-radius: 12px;
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #5865F2 0%, #8b5cf6 50%, #EB459E 100%);
    background-size: 200% 200%;
    box-shadow: 0 10px 30px rgba(88,101,242,.35);
    transition: transform .15s, box-shadow .2s, background-position .4s;
    position: relative; overflow: hidden;
  }
  button:hover { background-position: 100% 0; box-shadow: 0 12px 38px rgba(235,69,158,.4); }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .55; cursor: wait; transform: none; }
  button .spin { display: none; }
  button.loading .label { display: none; }
  button.loading .spin {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status {
    font-size: 13px; margin-top: 14px; min-height: 18px;
    text-align: center; letter-spacing: .02em;
    opacity: 0; transform: translateY(-4px); transition: all .25s;
  }
  #status.show { opacity: 1; transform: none; }
  #status.ok  { color: #57F287; text-shadow: 0 0 14px rgba(87,242,135,.5); }
  #status.err { color: #ED4245; text-shadow: 0 0 14px rgba(237,66,69,.5); }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="brand"><span class="dot"></span><h1>send</h1></div>

  <label for="hook">webhook</label>
  <div class="field">
    <input id="hook" placeholder="https://discord.com/api/webhooks/..." spellcheck="false">
  </div>

  <label for="msg">message</label>
  <div class="field">
    <textarea id="msg" placeholder="Type your text here..."></textarea>
  </div>

  <button id="send" type="submit">
    <span class="label">Send</span>
    <span class="spin"></span>
  </button>

  <div id="status"></div>
</form>

<script>
const f      = document.getElementById('f');
const hookEl = document.getElementById('hook');
const msgEl  = document.getElementById('msg');
const btn    = document.getElementById('send');
const status = document.getElementById('status');

hookEl.value = localStorage.getItem('hook') || '';
hookEl.addEventListener('input', () => localStorage.setItem('hook', hookEl.value));

function setStatus(text, kind) {
  status.textContent = text;
  status.className = 'show ' + (kind || '');
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = hookEl.value.trim();
  const content = msgEl.value.trim();
  setStatus('', '');

  if (!url || !content) return setStatus('need webhook + text', 'err');
  if (!/^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/webhooks\//.test(url))
    return setStatus('that aint a discord webhook', 'err');

  btn.disabled = true; btn.classList.add('loading');
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    if (r.ok || r.status === 204) { setStatus('sent', 'ok'); msgEl.value = ''; }
    else setStatus('failed: ' + r.status, 'err');
  } catch (err) {
    setStatus('error: ' + err.message, 'err');
  } finally {
    btn.disabled = false; btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
